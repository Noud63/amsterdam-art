<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="map.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Stardos Stencil"
      rel="stylesheet"
    />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=roboto">
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css"
      integrity="sha512-puBpdR0798OZvTTbP4A8Ix/l+A4dHDD0DGqYW6RQ+9jxkRFclaxxQb/SJAWZfWAkuyeQUytO7+7N4QKrDh+drA=="
      crossorigin=""
    />
    <!-- <link rel="stylesheet" type="text/css" href="leaflet.css"> -->
    <script
      src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"
      integrity="sha512-QVftwZFqvtRNi0ZyCtsznlKSWOStnDORoefr1enyq5mVL4tmKB3S/EnC3rRJcxCPavG10IcrVGSmPh6Qw5lwrg=="
      crossorigin=""
    ></script>
    <script
      type="text/javascript"
      src="leaflet.smoothmarkerbouncing.js"
    ></script>
  </head>

  <body>
    <div id="container">
      <div id="mapid"></div>
    </div>

    <div class="menu">
      <div>
<button class="museums">Museums</button>
      <button class="galleries">Galleries</button>
      <button class="publicArt">Public Art</button>
      </div>
      <div>
 <button class="artcentre">Art Centres</button>
      <button class="reset">Reset</button>
      <button class="informatie">Info</button>
      </div>
     
    </div>

    <div class="menubar">
      <button class="museums">Museums</button>
      <button class="galleries">Galleries</button>
      <button class="publicArt">Public Art</button>
      <button class="artcentre">Art Centres</button>
      <button class="reset">Reset</button>
    </div>

    <div class="infowindow">Please note that not all the markers on the map may be visible within the boundaries of your screen.<br />
      If so, zoom out by using the - button at the bottom right of the screen.</div>

    <button class="hamburger" aria-expanded="false" aria-label="Open menu">
  <img src="images/hamburger.png" class="icon icon-closed" alt="">
  <img src="images/close_cross.png" class="icon icon-open" alt="">
</button>

    <div class="sidebar" id="sidebar">
      <div class="listPopUpWrapper">
        <div class="hideSidebar" id="hidesidebar">
          <img
            src="images/triangle.png"
            alt="Close Sidebar"
            style="width: 7px"
          />
        </div>
        <img src="images/nachtwacht.jpg" id="adam" />
        <div id="listings" class="listings"></div>
      </div>
    </div>

    <div class="wrapper"></div>

    <script type="text/javascript" src="geolocation.js"></script>
    <script type="text/javascript" src="map.js"></script>
    <script type="text/javascript" src="buildList.js"></script>
    <script type="text/javascript" src="layers.js"></script>
    <script type="text/javascript" src="utils.js"></script>
  </body>
</html>
