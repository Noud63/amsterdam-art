<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="map.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Stardos Stencil"
      rel="stylesheet"
    />
    <!-- <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=roboto"
    /> -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- <link rel="stylesheet" type="text/css" href="leaflet.css"> -->

    <script
      type="text/javascript"
      src="leaflet.smoothmarkerbouncing.js"
    ></script>
  </head>

  <body>
    <div id="container">
      <div id="mapid"></div>
    </div>

    <div class="amsterdam_logo"><img src="images/amsterdam_logo_wit.png" alt=""></div>
    <div class="amsterdam_logo_right"><img src="images/amsterdam_logo_wit.png" alt=""></div>
    <div class="artinamsterdam"><img src="images/artinamsterdam_black.png" alt=""></div>

    <div class="menuTop">
      <button class="museums">Museums</button>
      <button class="galleries">Galleries</button>
      <button class="publicArt">Public Art</button>
      <button class="artcentre">Art Centres</button>
      <button class="reset">Reset</button>
      <button class="informatie">Info</button>
    </div>

    <!-- <div class="menu">
      <div>
        <button class="museums">Museums</button>
        <button class="galleries">Galleries</button>
        <button class="publicArt">Public Art</button>
      </div>
      <div>
        <button class="artcentre">Art Centres</button>
        <button class="reset">Reset</button>
        <button class="informatie">Info</button>
        <button class="informatie">Info</button>
      </div>
    </div> -->

    <div class="menubar">
      <button class="museums">Museums</button>
      <button class="galleries">Galleries</button>
      <button class="publicArt">Public Art</button>
      <button class="artcentre">Art Centres</button>
      <button class="reset">Reset</button>
      <button class="informatie">Info</button>
    </div>

    <button class="hamburger" aria-expanded="false" aria-label="Open menu">
      <img src="images/hamburger.png" class="icon icon-closed" alt="" />
      <img src="images/close_cross.png" class="icon icon-open" alt="" />
    </button>

    <div class="infowindow">
      <div class="infowindowTitle">Art in Amsterdam</div>
      <div>
        This map highlights <span class="listLength"></span> locations featuring
        galleries, museums, art centres and public art.
      </div>
      <br />
      <div>
        Please note that not all the markers on the map may be visible within
        the boundaries of your screen.<br />
        If so, zoom out by using the - button at the bottom right of the screen.
      </div>
      <div class="close">
              <img src="images/close_white.png" class="closeIcon_info"/>
             </div>
    </div>

    

    <div class="sidebar" id="sidebar">
      <div class="listPopUpWrapper">
        <div class="hideSidebar" id="hidesidebar">
          <img
            src="images/triangle.png"
            alt="Close Sidebar"
            style="width: 7px"
          />
        </div>
        <img src="images/nachtwacht_zw.jpg" id="adam" />
        <div id="listings" class="listings"></div>
      </div>
    </div>

    <div class="wrapper"></div>

    <script type="text/javascript" src="geolocation.js"></script>
    <script type="text/javascript" src="map.js"></script>
    <script type="text/javascript" src="buildList.js"></script>
    <script type="text/javascript" src="layers.js"></script>
    <script type="text/javascript" src="utils.js"></script>
  </body>
</html>
